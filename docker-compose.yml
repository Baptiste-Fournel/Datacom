services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: datacom
      POSTGRES_USER: datacom
      POSTGRES_PASSWORD: datacom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacom -d datacom"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/datacom
      DB_USERNAME: datacom
      DB_PASSWORD: datacom
      FRONT_ORIGINS: ${FRONT_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

volumes:
  pgdata:
