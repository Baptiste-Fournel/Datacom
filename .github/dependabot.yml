version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      maven-correctifs:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 1
    groups:
      actions-correctifs:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
