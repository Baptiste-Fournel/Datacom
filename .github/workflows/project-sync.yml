name: project-sync

on:
  workflow_dispatch:
    inputs:
      target_project:
        description: "Numero du board Projects a cibler (vide = board Datacom le plus ancien)"
        required: false
        default: ""
  push:
    branches: [main, develop]
    paths:
      - .github/workflows/project-sync.yml

permissions:
  contents: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rapport d etat des tickets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh issue list -R "$REPO" --state all --limit 100 \
            --json number,title,state,milestone,labels \
            --jq 'sort_by(.number)' > /tmp/issues.json
          jq -r '.[] | [.number, .state, (.milestone.title // "-"), .title] | @tsv' /tmp/issues.json \
            | column -t -s $'\t' | sed 's/^/  /'
          echo "open restants : $(jq '[.[]|select(.state=="OPEN")]|length' /tmp/issues.json)"

      - name: Board Projects - items, statuts et chronologie
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_PAT || secrets.PROJECT_PAT }}
          REPO: ${{ github.repository }}
          TARGET_PROJECT: ${{ github.event.inputs.target_project }}
        run: |
          set +e
          RESULT=ok; DETAIL=""
          if [ -z "$GH_TOKEN" ]; then
            RESULT=echec; DETAIL="secret PROJECTS_PAT absent"
          else
            NUM="${TARGET_PROJECT:-}"
            if [ -z "$NUM" ]; then
              NUM=$(gh project list --owner "@me" --format json --limit 50 2>/tmp/err | jq -r '
                [.projects[]] as $all
                | ([$all[]|select((.title|ascii_downcase)=="datacom")]|sort_by(.number)|.[0].number)
                  // ([$all[]|select(.title|test("datacom";"i"))]|sort_by(.number)|.[0].number)
                  // empty')
            fi
            if [ -z "$NUM" ]; then
              RESULT=echec; DETAIL="aucun board existant trouve (ne pas creer) : $(tr '\n' ' ' </tmp/err | head -c 250)"
            else
              PJSON=$(gh project view "$NUM" --owner "@me" --format json)
              PID=$(echo "$PJSON" | jq -r '.id'); PURL=$(echo "$PJSON" | jq -r '.url')
              BOARDS=$(gh project list --owner "@me" --format json --limit 50 | jq -c '[.projects[]|select(.title|test("datacom";"i"))|{number,title,items:((.items.totalCount)//null)}]|sort_by(.number)')
              FL=$(gh project field-list "$NUM" --owner "@me" --format json --limit 50)
              fid() { echo "$FL" | jq -r --arg n "$1" '.fields[]|select(.name==$n)|.id' | head -1; }
              ensure_date() {
                local id; id=$(fid "$1")
                if [ -z "$id" ]; then
                  gh project field-create "$NUM" --owner "@me" --name "$1" --data-type DATE >/dev/null 2>&1
                  FL=$(gh project field-list "$NUM" --owner "@me" --format json --limit 50); id=$(fid "$1")
                fi
                echo "$id"
              }
              SID=$(fid "Status"); STARTID=$(ensure_date "Start"); TARGETID=$(ensure_date "Target")
              sopt() { echo "$FL" | jq -r --arg n "$1" '.fields[]|select(.name=="Status")|.options[]|select(.name|ascii_downcase==($n|ascii_downcase))|.id' | head -1; }
              O_TODO=$(sopt "Todo"); O_WIP=$(sopt "In Progress"); O_DONE=$(sopt "Done")

              gh issue list -R "$REPO" --state all --limit 100 --json number,url,state > /tmp/il.json
              for URL in $(jq -r '.[].url' /tmp/il.json); do
                gh project item-add "$NUM" --owner "@me" --url "$URL" >/dev/null 2>&1
              done
              EXIST=$(gh project item-list "$NUM" --owner "@me" --format json --limit 200)
              if ! echo "$EXIST" | jq -e '.items[]|select(.title|test("Pr.sentation orale"))' >/dev/null 2>&1; then
                gh project item-create "$NUM" --owner "@me" --title "Présentation orale (rédaction)" >/dev/null 2>&1
              fi

              BRANCHES=$(git ls-remote --heads origin 'refs/heads/feature/*' | sed 's#.*/feature/##')
              gh project item-list "$NUM" --owner "@me" --format json --limit 200 \
                | jq -c '.items[] | {item:.id, number:(.content.number // 0), title:.title}' \
                | while read -r row; do
                    ITEM=$(jq -r .item <<<"$row")
                    NUMBER=$(jq -r .number <<<"$row"); TITLE=$(jq -r .title <<<"$row")
                    if echo "$TITLE" | grep -qi "sentation orale"; then
                      S="2026-07-30"; T="2026-07-30"; TARGET="$O_TODO"
                    else
                      TCODE=$(echo "$TITLE" | grep -oE 'T[0-9]+' | head -1 | tr -d 'T' | sed 's/^0*//')
                      [ -z "$TCODE" ] && continue
                      if [ "$TCODE" -le 8 ]; then S="2026-07-27";
                      elif [ "$TCODE" -le 13 ]; then S="2026-07-28";
                      else S="2026-07-29"; fi
                      T="$S"
                      STATE=$(jq -r --argjson n "$NUMBER" '.[]|select(.number==$n)|.state' /tmp/il.json)
                      TARGET="$O_TODO"
                      if [ "$STATE" = "CLOSED" ]; then TARGET="$O_DONE";
                      elif echo "$BRANCHES" | grep -q "T${TCODE}-"; then TARGET="$O_WIP"; fi
                    fi
                    [ -n "$STARTID" ] && gh project item-edit --project-id "$PID" --id "$ITEM" --field-id "$STARTID" --date "$S" >/dev/null 2>&1
                    [ -n "$TARGETID" ] && gh project item-edit --project-id "$PID" --id "$ITEM" --field-id "$TARGETID" --date "$T" >/dev/null 2>&1
                    [ -n "$SID" ] && [ -n "$TARGET" ] && gh project item-edit --project-id "$PID" --id "$ITEM" --field-id "$SID" --single-select-option-id "$TARGET" >/dev/null 2>&1
                  done
              ICOUNT=$(gh project item-list "$NUM" --owner "@me" --format json --limit 200 | jq '.items|length')
              DETAIL="board #$NUM ($ICOUNT items) : statuts et chronologie 27-29/07 posees, oral au 30/07"
            fi
          fi
          jq -n --arg r "$RESULT" --arg d "$DETAIL" --arg u "${PURL:-}" --argjson b "${BOARDS:-[]}" --slurpfile issues /tmp/issues.json \
            '{result:$r, detail:$d, board_url:$u, boards:$b, open_count:([$issues[0][]|select(.state=="OPEN")]|length)}' > /tmp/report.json
          echo "$DETAIL"

      - name: Publier le rapport sur ci-status
        if: always()
        run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          if git fetch origin ci-status 2>/dev/null; then git checkout -B ci-status origin/ci-status; else git checkout --orphan ci-status; git rm -rf --cached . >/dev/null 2>&1 || true; fi
          cp /tmp/report.json roadmap-report.json
          git add roadmap-report.json
          git commit -m "ci: rapport roadmap" >/dev/null || exit 0
          for i in 1 2 3; do git push origin ci-status && break; git fetch origin ci-status && git rebase origin/ci-status; done
