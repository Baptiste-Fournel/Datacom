openapi: 3.0.3
info:
  title: DataCom API
  version: 1.0.0
  description: >
    Contrat de l'API DataCom — source de vérité partagée entre le back (Spring Boot)
    et le front (SvelteKit). Toute évolution passe par une pull request sur ce fichier.
    Authentification par cookie de session HttpOnly ; toute mutation exige le header
    X-XSRF-TOKEN recopié depuis le cookie XSRF-TOKEN. Requêtes en credentials include.
servers:
  - url: http://localhost:8080
    description: Développement

tags:
  - name: auth
  - name: products
    description: Espace opérateur (rôle OPERATOR requis)
  - name: validation
    description: Espace validateur (rôle VALIDATOR requis)

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Ouvre une session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204':
          description: Session ouverte (cookies SESSION et XSRF-TOKEN posés)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Ferme la session
      responses:
        '204': { description: Session fermée }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Utilisateur connecté
      responses:
        '200':
          description: Identité et rôle de la session courante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500': { $ref: '#/components/responses/ServerError' }

  /api/products:
    get:
      tags: [products]
      summary: Liste toutes les fiches (tous statuts)
      responses:
        '200':
          description: Fiches triées par identifiant décroissant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [products]
      summary: Crée une fiche en brouillon (étape 1)
      responses:
        '201':
          description: Brouillon créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/products/{id}:
    get:
      tags: [products]
      summary: Détail d'une fiche
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses:
        '200':
          description: Fiche complète
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/products/{id}/identification:
    put:
      tags: [products]
      summary: Renseigne l'étape 1 (identification)
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentificationUpdate' }
      responses:
        '200': { $ref: '#/components/responses/UpdatedProduct' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/products/{id}/classification:
    put:
      tags: [products]
      summary: Renseigne l'étape 2 (classification)
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassificationUpdate' }
      responses:
        '200': { $ref: '#/components/responses/UpdatedProduct' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/products/{id}/certification:
    put:
      tags: [products]
      summary: Renseigne l'étape 3 (certification et traçabilité)
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificationUpdate' }
      responses:
        '200': { $ref: '#/components/responses/UpdatedProduct' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/products/{id}/advance:
    post:
      tags: [products]
      summary: Avance la fiche à l'étape suivante
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses:
        '200': { $ref: '#/components/responses/UpdatedProduct' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/products/{id}/submit:
    post:
      tags: [products]
      summary: Soumet la fiche à validation (statut PENDING_VALIDATION, fiche gelée)
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses:
        '200': { $ref: '#/components/responses/UpdatedProduct' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/validation/queue:
    get:
      tags: [validation]
      summary: File des fiches en attente de validation (uniquement PENDING_VALIDATION)
      responses:
        '200':
          description: File de travail du validateur
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/validation/products/{id}:
    get:
      tags: [validation]
      summary: Détail en lecture seule d'une fiche en attente
      description: 403 si la fiche n'est pas en statut PENDING_VALIDATION (garde anti-IDOR).
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses:
        '200':
          description: Fiche complète
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/validation/products/{id}/validate:
    post:
      tags: [validation]
      summary: Valide la conformité (statut VALIDATED, irréversible)
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses:
        '200': { $ref: '#/components/responses/UpdatedProduct' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Requis sur toute mutation, recopié depuis le cookie XSRF-TOKEN

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    UpdatedProduct:
      description: Fiche mise à jour
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductDetail' }
    BadRequest:
      description: Corps JSON malformé ou paramètre invalide (code VALIDATION_ERROR)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur interne inattendue (corps neutre, sans détail exposé ni code)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Session absente ou expirée
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Rôle insuffisant ou ressource hors de l'espace autorisé
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Fiche inexistante
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Transition d'état refusée par le domaine
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            notEditable:
              value: { type: 'about:blank', title: Conflict, status: 409, detail: The product is no longer editable, code: NOT_EDITABLE }
            incomplete:
              value: { type: 'about:blank', title: Conflict, status: 409, detail: The product cannot be submitted before reaching the final step, code: INCOMPLETE_PRODUCT }

  schemas:
    Role:
      type: string
      enum: [OPERATOR, VALIDATOR]
    ProductStatus:
      type: string
      enum: [DRAFT, PENDING_VALIDATION, VALIDATED]
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    CurrentUser:
      type: object
      required: [id, login, firstname, lastname, role]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
        firstname: { type: string }
        lastname: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    ProductSummary:
      type: object
      required: [id, status, currentStep]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProductStatus' }
        currentStep: { type: integer, minimum: 1, maximum: 4 }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [createdBy, createdAt, updatedAt]
          properties:
            description: { type: string, nullable: true }
            category: { type: string, nullable: true }
            subcategory: { type: string, nullable: true }
            manufacturer: { type: string, nullable: true }
            country: { type: string, nullable: true }
            lot: { type: string, nullable: true }
            certification: { type: string, nullable: true }
            validationComment: { type: string, nullable: true }
            createdBy: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    IdentificationUpdate:
      type: object
      properties:
        name: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        description: { type: string, nullable: true }
    ClassificationUpdate:
      type: object
      properties:
        category: { type: string, nullable: true }
        subcategory: { type: string, nullable: true }
        manufacturer: { type: string, nullable: true }
        country: { type: string, nullable: true }
    CertificationUpdate:
      type: object
      properties:
        lot: { type: string, nullable: true }
        certification: { type: string, nullable: true }
        validationComment: { type: string, nullable: true }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, NOT_EDITABLE, INCOMPLETE_PRODUCT, ILLEGAL_TRANSITION]

security:
  - sessionCookie: []
